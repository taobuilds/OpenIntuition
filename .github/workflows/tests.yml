name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Run installed demo
        run: openintuition demo --output results/ci-demo
      - name: Check dependencies
        run: python -m pip check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-${{ matrix.os }}
          path: results/ci-demo/
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install . playwright
      - run: python -m playwright install --with-deps chromium
      - run: openintuition demo --output results/browser-demo
      - run: python scripts/check_browser_report.py results/browser-demo/report.html
