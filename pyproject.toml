[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "openintuition"
version = "0.2.0"
description = "Offline regression checks for preference state updates"
authors = [{name = "taobuilds"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.urls]
Repository = "https://github.com/taobuilds/OpenIntuition"
Issues = "https://github.com/taobuilds/OpenIntuition/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
openintuition = "openintuition_memory_check.cli:main"

[tool.setuptools.package-data]
openintuition_memory_check = ["resources/*.html", "resources/*.png", "resources/*.jsonl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
