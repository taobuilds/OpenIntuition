<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>OpenIntuition · Memory report</title>
<style>
:root{--ink:#182e35;--muted:#526d72;--teal:#087d83;--paper:#f7f5ed;--line:#d7dfd8;--amber:#eeb640;--bad:#a13224}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1240px;margin:auto;padding:28px}header{display:flex;align-items:center;gap:18px;border-bottom:2px solid var(--ink);padding-bottom:22px}header img{width:82px;height:82px;object-fit:contain}h1{font-size:30px;margin:0;letter-spacing:-1px}h2{font-size:20px;margin:0 0 12px}h3{font-size:15px;margin:20px 0 8px}p{margin:8px 0}.muted{color:var(--muted)}header .language{margin-left:auto}button,select{font:inherit}select{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;max-width:100%;color:var(--ink)}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:3px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin:24px 0}.card{background:#fff;border:1px solid var(--line);padding:20px;border-radius:14px}.score{font-size:34px;font-weight:750;margin:10px 0}.meter{height:6px;background:#e6ece7;border-radius:5px}.meter div{height:100%;background:var(--teal);border-radius:5px}.notice{border-left:4px solid var(--amber);padding:10px 16px;background:#fff8e6}.filters{display:flex;flex-wrap:wrap;gap:14px;margin:24px 0}.filters label{display:flex;flex-direction:column;gap:4px;min-width:150px}.workspace{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,1fr);gap:20px}.panel{border:1px solid var(--line);border-radius:14px;background:#fff;padding:20px;min-width:0}.scroll{overflow:auto;max-height:590px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}th{position:sticky;top:0;background:#fff;z-index:1}td button{background:transparent;border:0;color:var(--teal);padding:0;text-align:left;text-decoration:underline}tr.selected{background:#edf6f3}.tag{border-radius:5px;padding:3px 7px;background:#e3f1eb;color:#176044;white-space:nowrap}.tag.bad{background:#fcece7;color:var(--bad)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{padding:12px;background:#f1f5ef;border-radius:8px;overflow-wrap:anywhere}.answer.bad{background:#fcece7}.value{font-size:22px;font-weight:700}.timeline{padding-left:26px}.timeline li{padding:9px 0}.timeline code{font-size:13px;background:#eff4ee;padding:3px;border-radius:4px;overflow-wrap:anywhere}.timeline p{margin:3px 0}.history{white-space:pre-wrap;overflow-wrap:anywhere}.explanation{padding:12px;background:#fff8e6;border-radius:8px}footer{margin:28px 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.empty{padding:30px;color:var(--muted)}@media(max-width:820px){main{padding:16px}.workspace{grid-template-columns:1fr}header img{width:60px;height:60px}h1{font-size:25px}header{gap:10px}.filters label{min-width:130px;flex:1}header .language{align-self:flex-start}.scroll{max-height:350px}}
</style>
</head>
<body><main>
<header><img src="data:image/png;base64,__MASCOT__" alt="OpenIntuition owl"><div><h1>OpenIntuition</h1><p class="muted" data-text="subtitle"></p></div><label class="language"><span class="muted" data-text="language"></span><br><select id="language" aria-label="Language"><option value="zh">简体中文</option><option value="en">English</option></select></label></header>
<p class="muted" data-text="overall"></p>
<section id="cards" class="cards" aria-label="Scores"></section>
<p class="notice" data-text="notice"></p>
<div class="filters">
<label><span data-text="policy"></span><select id="policy"></select></label>
<label><span data-text="category"></span><select id="category"></select></label>
<label><span data-text="scenario"></span><select id="scenario"></select></label>
<label><span data-text="outcome"></span><select id="outcome"></select></label>
</div>
<div class="workspace"><section class="panel"><h2 data-text="checkpoints"></h2><p id="count" class="muted" aria-live="polite"></p><div class="scroll"><table><thead><tr><th data-text="scenario"></th><th data-text="query"></th><th data-text="policy"></th><th data-text="outcome"></th></tr></thead><tbody id="rows"></tbody></table><p id="empty" class="empty" hidden data-text="empty"></p></div></section>
<section class="panel" id="detail" aria-label="Checkpoint detail" aria-live="polite"></section></div>
<footer id="provenance"></footer>
<noscript>This interactive report requires JavaScript. Read report.md for a text-only result.</noscript>
</main>
<script type="application/json" id="report-data">__DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('report-data').textContent);
const words={
zh:{overall:'整份数据的结果；下方筛选只影响记录列表。',subtitle:'偏好变了，记忆也应该跟着变。',language:'语言',notice:'这是人工场景上的规则符合性检查，不代表真实模型的记忆能力。同一场景内的检查点共享历史。',policy:'策略',category:'类别',scenario:'场景',outcome:'结果',checkpoints:'逐条检查',query:'检查点',empty:'没有符合筛选条件的记录。',all:'全部',failed:'答错',passed:'答对',expected:'参考答案',predicted:'策略答案',history:'当时可见的事件',prefix:'只展示截至查询步骤的历史，后续事件没有参与这次预测。',select:'请选择一个检查点。',step:'步骤',key:'偏好',session:'会话',permanent:'长期设置',temporary:'会话例外',revoke:'撤销',note:'信息备注',update:'长期更新',distractor:'无关事件',scenarios:'完整场景全部答对',correct:'检查点答对',matches:'条记录',reason:'如何解释这条结果',rule:'按当前规则，先处理长期设置和会话例外；新的 set 和 revoke 会清除该偏好的旧例外。没有适用值时回答 ASK。',naive:'简单策略只取最后一次 set/temporary 的值，忽略会话范围与 revoke。',scopeError:'最后一次赋值来自其他会话的临时要求，它不应该覆盖当前会话的设置。',revokeError:'最近一次撤销之后，这个会话没有新的适用设置，旧值不应该重新出现。',ok:'本次预测与人工标签一致；这不等于该策略适用于所有场景。',fingerprint:'输入数据 SHA-256',version:'工具版本',data:'数据文件'},
en:{overall:'Scores cover the full dataset; filters below apply only to the record list.',subtitle:'When preferences change, memory should too.',language:'Language',notice:'Rule conformance on authored examples, not real-model memory performance. Checkpoints within a scenario share a history.',policy:'Policy',category:'Category',scenario:'Scenario',outcome:'Outcome',checkpoints:'Checkpoint explorer',query:'Checkpoint',empty:'No records match these filters.',all:'All',failed:'Mismatch',passed:'Match',expected:'Expected',predicted:'Predicted',history:'Events available at this query',prefix:'Only the prefix up to the query step is shown. Later events did not participate in this prediction.',select:'Choose a checkpoint.',step:'Step',key:'Key',session:'Session',permanent:'Permanent setting',temporary:'Session exception',revoke:'Revocation',note:'Information note',update:'Permanent update',distractor:'Unrelated events',scenarios:'scenarios fully correct',correct:'checkpoints correct',matches:'records',reason:'Reading this result',rule:'The specified rules apply permanent settings and session exceptions. A new set or revoke clears older exceptions for that key. With no applicable value, return ASK.',naive:'The baseline takes the latest set/temporary value, ignoring session scope and revoke.',scopeError:'The latest assignment belongs to a temporary request in another session; it should not replace this session’s setting.',revokeError:'No applicable setting was added for this session after the latest revocation; the withdrawn value should not return.',ok:'This prediction matches the authored label. It does not establish correctness in every scenario.',fingerprint:'Input SHA-256',version:'Tool version',data:'Dataset'}
};
let lang='zh', selected=null;
const byId=id=>document.getElementById(id), t=key=>words[lang][key]||key;
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;}
function options(id,values){const select=byId(id),old=select.value;select.replaceChildren();for(const [value,label] of values){const option=el('option',label);option.value=value;select.append(option);}if([...select.options].some(o=>o.value===old))select.value=old;}
function initialize(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-text]').forEach(n=>n.textContent=t(n.dataset.text));
 options('policy',[['',t('all')],...Object.keys(data.summary).map(n=>[n,n])]);
 options('category',[['',t('all')],...new Set(data.predictions.map(r=>r.category))].map(v=>typeof v==='string'?[v,t(v)]:v));
 options('scenario',[['',t('all')],...[...new Set(data.predictions.map(r=>r.scenario))].map(n=>[n,n])]);
 options('outcome',[['',t('all')],['failed',t('failed')],['passed',t('passed')]]);
 byId('cards').replaceChildren();for(const [name,s] of Object.entries(data.summary)){const card=el('article',undefined,'card');card.append(el('strong',name),el('div',`${s.correct}/${s.total} · ${(s.accuracy*100).toFixed(1)}%`,'score'),el('p',t('correct'),'muted'));const meter=el('div',undefined,'meter'),fill=el('div');fill.style.width=`${s.accuracy*100}%`;meter.append(fill);card.append(meter,el('p',`${s.scenarios_passed}/${s.scenarios_total} ${t('scenarios')}`));byId('cards').append(card);}
 const m=data.manifest;byId('provenance').textContent=`${t('version')}: ${m.tool_version} · ${t('data')}: ${m.dataset.name} · ${t('fingerprint')}: ${m.dataset.sha256}`;render();}
function filtered(){return data.predictions.filter(r=>(!byId('policy').value||r.policy===byId('policy').value)&&(!byId('category').value||r.category===byId('category').value)&&(!byId('scenario').value||r.scenario===byId('scenario').value)&&(!byId('outcome').value||r.correct===(byId('outcome').value==='passed')));}
function render(){const rows=filtered();if(!rows.includes(selected))selected=rows.find(r=>!r.correct)||rows[0]||null;byId('rows').replaceChildren();byId('count').textContent=`${rows.length} ${t('matches')}`;byId('empty').hidden=rows.length>0;
 for(const row of rows){const tr=el('tr');if(row===selected)tr.className='selected';tr.append(el('td',row.scenario));const query=el('td'),button=el('button',`${row.checkpoint} · ${t('step')} ${row.as_of_step}`);button.type='button';button.setAttribute('aria-label',`${row.scenario} ${row.checkpoint} ${row.policy}`);button.setAttribute('aria-pressed',String(row===selected));button.onclick=()=>{selected=row;render();const active=[...byId('rows').querySelectorAll('button')].find(b=>b.getAttribute('aria-label')===button.getAttribute('aria-label'));if(active)active.focus({preventScroll:true});};query.append(button);tr.append(query,el('td',row.policy));const status=el('td');status.append(el('span',t(row.correct?'passed':'failed'),`tag${row.correct?'':' bad'}`));tr.append(status);byId('rows').append(tr);}detail();}
function detail(){const panel=byId('detail');panel.replaceChildren();if(!selected){panel.append(el('p',t('select'),'muted'));return;}const r=selected;panel.append(el('h2',`${r.scenario} / ${r.checkpoint}`),el('p',`${t('key')}: ${r.key} · ${t('session')}: ${r.session_id} · ${t('step')}: ${r.as_of_step}`,'muted'));
 const answers=el('div',undefined,'answers');for(const [label,value,bad] of [[t('expected'),r.expected,false],[t('predicted'),r.predicted,!r.correct]]){const box=el('div',undefined,`answer${bad?' bad':''}`);box.append(el('div',label,'muted'),el('div',value,'value'));answers.append(box);}panel.append(answers,el('h3',t('history')),el('p',t('prefix'),'muted'));
 const list=el('ol',undefined,'timeline');for(const e of r.events){const item=el('li');item.append(el('code',`${e.step} · ${e.op} · ${e.key}${e.session_id===null?'':` · ${e.session_id}`}`),el('p',e.value===null?'∅':e.value,'history'));list.append(item);}panel.append(list,el('h3',t('reason')));
 let reason=t('rule');if(r.correct)reason=t('ok');else if(r.policy==='naive_last_value'){
 reason=t('naive');const related=r.events.filter(e=>e.key===r.key),assignments=related.filter(e=>e.op==='set'||e.op==='temporary'),last=assignments.at(-1),revoked=related.filter(e=>e.op==='revoke').at(-1),afterRevoke=related.some(e=>revoked&&e.step>revoked.step&&(e.op==='set'||(e.op==='temporary'&&e.session_id===r.session_id)));
 if(r.expected==='ASK'&&revoked&&!afterRevoke)reason+=' '+t('revokeError');else if(last&&last.op==='temporary'&&last.session_id!==r.session_id)reason+=' '+t('scopeError');
 }panel.append(el('p',reason,'explanation'));}
byId('language').addEventListener('change',()=>{lang=byId('language').value;initialize();});for(const id of ['policy','category','scenario','outcome'])byId(id).addEventListener('change',render);initialize();
</script>
</body></html>
